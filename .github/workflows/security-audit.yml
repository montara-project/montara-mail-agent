# Dependency vulnerability scan. govulncheck reports only the Go modules the
# binaries actually call (calls analysis); pnpm audit reports the npm trees.
# Both run on pushes and pull requests, and weekly, so a newly published
# advisory surfaces without a push.
#
# Fix policy: an advisory found here lands in ISSUES.md with a minimum-version
# override in pnpm-workspace.yaml (npm) or a go.mod bump (Go) — see S-6 there.
name: Security Audit

on:
  push:
    branches: ['main', 'dev']
  pull_request:
  schedule:
    # 03:00 UTC every Monday.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod

      - name: Scan Go modules
        working-directory: apps/server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Scan npm dependencies
        run: pnpm audit --prod
