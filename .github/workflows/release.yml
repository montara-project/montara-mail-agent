# Publishes the Docker images to GitHub Container Registry and deploys the
# marketing site to Cloudflare Workers.
#
# Triggers:
#   - a semver tag (v1.2.3) publishes v1.2.3, v1.2 and latest
#   - a manual run publishes the short commit SHA, plus any tag you pass in
#
# Images, named <product>/<edition>, both the Go API serving the web app
# (apps/server + apps/web-ui):
#   ghcr.io/<owner>/montara-mail-agent/cloud      Cloud Edition: open sign-up
#   ghcr.io/<owner>/montara-mail-agent/community  Community Edition: one self-hosted user, no sign-up

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag to publish (the short commit SHA is always published)
        required: false
        type: string

# Only one release per ref; a re-push of the same tag supersedes the running build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  PLATFORMS: linux/amd64

jobs:
  release-images:
    name: Release ${{ matrix.edition }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push the image to ghcr.io with the workflow's GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        edition: [cloud, community]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/montara-mail-agent/${{ matrix.edition }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short,prefix=sha-

      # The image installs from the workspace lockfile, so it builds from the root.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite bakes the VITE_* values into the web app inside the image and
          # EDITION goes into both it and the Go binary. An empty VITE_API_URL
          # keeps the edition's default server (apps/web-ui/src/config/env.ts);
          # the repo Variable only points the Cloud image at another API, as
          # the Community image always talks to itself.
          build-args: |
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'Montara Mail' }}
            VITE_API_URL=${{ matrix.edition == 'cloud' && vars.VITE_API_URL || '' }}
            EDITION=${{ matrix.edition }}
          push: true
          # One cache scope per image, or the builds evict each other.
          cache-from: type=gha,scope=${{ matrix.edition }}
          cache-to: type=gha,mode=max,scope=${{ matrix.edition }}

  # Deploys the marketing site on every release run (tag push or manual
  # dispatch); the workflow itself never triggers on branch pushes.
  release-web:
    name: Deploy main-web to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @montara-mail/main-web...

      # vinext-cloudflare builds, then deploys the Worker described in
      # apps/main-web/cloudflare.config.ts.
      - name: Build & Deploy
        run: pnpm deploy:main-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
