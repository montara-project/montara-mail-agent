# Publishes the Docker image to GitHub Container Registry and deploys the
# marketing site to Cloudflare Workers.
#
# Triggers:
#   - a semver tag (v1.2.3) publishes v1.2.3, v1.2 and latest
#   - a manual run publishes the short commit SHA, plus any tag you pass in
#
# Image:
#   ghcr.io/<owner>/montara-mail-agent   the Go API serving the web app (apps/server + apps/web-ui)

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag to publish (the short commit SHA is always published)
        required: false
        type: string

# Only one release per ref; a re-push of the same tag supersedes the running build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/montara-mail-agent
  PLATFORMS: linux/amd64

jobs:
  release-image:
    name: Release image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push the image to ghcr.io with the workflow's GITHUB_TOKEN.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short,prefix=sha-

      # The image installs from the workspace lockfile, so it builds from the root.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite bakes the VITE_* values into the web app inside the image.
          # An empty VITE_API_URL keeps the app's default server (see
          # apps/web-ui/src/config/env.ts); set the repo Variable to point the
          # image at another API.
          build-args: |
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'Montara Mail' }}
            VITE_API_URL=${{ vars.VITE_API_URL || '' }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys the marketing site on every release run (tag push or manual
  # dispatch); the workflow itself never triggers on branch pushes.
  release-web:
    name: Deploy main-web to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @montara-mail/main-web...

      # vinext-cloudflare builds, then deploys the Worker described in
      # apps/main-web/cloudflare.config.ts.
      - name: Build & Deploy
        run: pnpm deploy:main-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
